    // activate chess board
    function activate_board() {
        for (var i = 0; i < document.querySelector("#table").children.length; i++) {
            for (var j = 0; j < document.querySelector("#table").children[i].children.length; j++) {

                document.querySelector("#table").children[i].children[j].addEventListener("mouseover", function () {
                    this.style.border = "1px solid black";
                });
                document.querySelector("#table").children[i].children[j].addEventListener("click", function () {
                    console.log(document.querySelector("#" + this.id).innerText);
                    clicked_piece("#" + this.id);
                    paly_piece(this.id);
                    console.log("turn: " + turn);
                    piececlickSound.play();
                    
                });
                document.querySelector("#table").children[i].children[j].addEventListener("mouseout", function () {
                    this.style.border = "none";
                });
            }
        }
    }

    var clickCount = 0;
    var selected_piece_id = "";

        if (clickCount == 0) {
            selected_piece_id = pid;
            clickCount++;
            console.log("selected_piece_id: " + selected_piece_id + "clickCount: " + clickCount);
        }
        else if (clickCount == 1) {
            target_piece_id = pid;
            console.log("target_piece_id: " + target_piece_id + "clickCount: " + clickCount);
            move_pieces(selected_piece_id, target_piece_id);
            clickCount = 0;
        }
    }

//swap piece from one location to another

        if (selected_piece_id == target_piece_id) {

        //make a rule lsit and check if the move is valid
        selected_piece = document.getElementById(selected_piece_id);
        target_location = document.getElementById(target_piece_id);
        if(selected_piece.style.backgroundImage == '' && target_location.style.backgroundImage == '' || selected_piece.style.backgroundImage == '' && target_location.style.backgroundImage != ''){
            clickCount = 0;
            return;
        }
        target_location.style.backgroundImage = selected_piece.style.backgroundImage;
        selected_piece.style.backgroundImage = "";

        pieceMoveSound.play();
    }

    function play() {
        if (paly_status == "off") {
            paly_status = "on";
            initial_load(); //loads table for starting game
            document.querySelector("body").style.backgroundColor = "#365641"; //changes background color 
            activate_board(); //activates the board
            turn = "white"; //white starts the game
            backgroundSound.play();
            backgroundSound.loop = true;
            backgroundSound.volume = 0.09;
        }
        else {
            paly_status = "off";
            document.querySelector("body").style.backgroundColor = "#FFFFFF";
            backgroundSound.pause();

        }
    }
